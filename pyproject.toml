[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkmath-rsi"
version = "0.1.0"
description = "本地数学数字笔迹到 LaTeX 的轻量识别研究原型"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "Pillow>=10.4", "torch>=2.5", "networkx>=3.2"]

[project.optional-dependencies]
demo = ["matplotlib>=3.9"]

[project.scripts]
inkmath = "inkmath.__main__:main"

[tool.setuptools.packages.find]
include = ["inkmath*"]
